name: Self-test

# Attacks the live testnet contracts with 4 scenarios, saves the results,
# and republishes the site so the Self-test page always shows the latest run.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["contracts/**", "agent/**", "scripts/**", "test/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: selftest
  cancel-in-progress: false

jobs:
  selftest:
    runs-on: ubuntu-latest
    outputs:
      ran: ${{ steps.keys.outputs.ok }}
    steps:
      - uses: actions/checkout@v4
      - id: keys
        name: Check testnet keys
        env:
          PK: ${{ secrets.PRIVATE_KEY }}
          AK: ${{ secrets.AGENT_PRIVATE_KEY }}
        run: |
          if [ -n "$PK" ] && [ -n "$AK" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::notice::Add PRIVATE_KEY and AGENT_PRIVATE_KEY secrets to run the self-test."; fi
      - uses: actions/setup-node@v4
        if: steps.keys.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install and compile
        if: steps.keys.outputs.ok == 'true'
        run: npm ci && npx hardhat compile
      - name: Unit tests (simulated Reactive loop)
        if: steps.keys.outputs.ok == 'true'
        run: npx hardhat test
      - name: Attack the live testnet guard
        if: steps.keys.outputs.ok == 'true'
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          AGENT_PRIVATE_KEY: ${{ secrets.AGENT_PRIVATE_KEY }}
        run: node scripts/selftest.js
      - name: Save results
        if: steps.keys.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/selftest.json
          git diff --cached --quiet || (git commit -m "Self-test results" && git push)

  publish:
    needs: selftest
    if: needs.selftest.outputs.ran == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
